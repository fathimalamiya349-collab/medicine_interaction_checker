<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Medicine Interaction Checker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>AI-powered Medicine Interaction Checker</h1>
    </header>
    <main>
        <section>
            <label for="medicines">Enter Medicines (separate by commas):</label>
            <input type="text" id="medicines" placeholder="e.g., Aspirin, Ibuprofen, Paracetamol">
            
            <button id="checkBtn">Check Interaction</button>
        </section>

        <section id="result">
            <h2>Interaction Results</h2>
            <div id="interactionInfo">No interactions checked yet.</div>
        </section>
    </main>
    <footer>
        <p>Powered by AI and Kaggle Datasets</p>
    </footer>
    <script>
        document.getElementById('checkBtn').addEventListener('click', async () => {
            const medicines = document.getElementById('medicines').value.trim();
            const resultBox = document.getElementById('interactionInfo');

            if (medicines) {
                const medicineArray = medicines.split(',').map(med => med.trim());
                if (medicineArray.length < 3) {
                    resultBox.innerHTML = "Please enter at least 3 medicines.";
                    return;
                }
                const results = await fetchInteraction(medicineArray);
                resultBox.innerHTML = results.join('<br>');
            } else {
                resultBox.innerHTML = "Please enter medicines.";
            }
        });

        async function fetchInteraction(meds) {
            let interactions = [];

            // Simulate interaction checking for every combination
            for (let i = 0; i < meds.length; i++) {
                for (let j = i + 1; j < meds.length; j++) {
                    for (let k = j + 1; k < meds.length; k++) {
                        interactions.push(`No known harmful interactions between ${meds[i]}, ${meds[j]}, and ${meds[k]}.`);
                    }
                }
            }

            if (interactions.length === 0) {
                interactions.push("Please enter at least three medicines to check.");
            }
            return interactions;
        }
    </script>
</body>
</html>
