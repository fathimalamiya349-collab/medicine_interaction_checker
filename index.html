<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Interaction Checker</title>
    <link rel="stylesheet"
    href="styles.css">
</head>
<body>
    <header>
        <h1>AI-powered Medicine Interaction Checker</h1>
    </header>
    <main>
        <section>
            <label for="medicine1">Enter First Medicine:</label>
            <input type="text" id="medicine1" placeholder="e.g., Aspirin">

            <label for="medicine2">Enter Second Medicine:</label>
            <input type="text" id="medicine2" placeholder="e.g., Ibuprofen">

            <button id="checkBtn">Check Interaction</button>
        </section>

        <section id="result">
            <h2>Interaction Results</h2>
            <p id="interactionInfo">No interaction data available yet.</p>
        </section>
    </main>
    <footer>
        <p>Powered by AI and Kaggle Datasets</p>
    </footer>
    <script>
        document.getElementById('checkBtn').addEventListener('click', async () => {
            const medicine1 = document.getElementById('medicine1').value;
            const medicine2 = document.getElementById('medicine2').value;
            if (medicine1 && medicine2) {
                const result = await fetchInteraction(medicine1, medicine2);
                document.getElementById('interactionInfo').textContent = result;
            } else {
                alert('Please enter both medicines.');
            }
        });

        async function fetchInteraction(med1, med2) {
            // For now, simulate a response
            return No known harmful interactions between ${med1} and ${med2}.;
        }
    </script>
</body>
</html>
